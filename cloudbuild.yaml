# ─── Bhrmari — Cloud Build (Hackathon Simple) ────────────────────────────────
# Builds frontend + backend in one image, deploys to Cloud Run
# No tests required — just build and deploy.
steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bhramari-api:latest', '-t', 'gcr.io/$PROJECT_ID/bhramari-api:$BUILD_ID', '.']

  # Push to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/bhramari-api:latest']
    
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-sha'
    args: ['push', 'gcr.io/$PROJECT_ID/bhramari-api:$BUILD_ID']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bhramari-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bhramari-api:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    waitFor: ['push-image-latest', 'push-image-sha']

substitutions:
  _REGION: 'us-central1'
