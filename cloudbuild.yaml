# ─── Bhrmari — Cloud Build (Hackathon Simple) ────────────────────────────────
# Builds frontend + backend in one image, deploys to Cloud Run
# No tests required — just build and deploy.
steps:
  # Build Docker image (multi-stage)
  - name: 'docker'
    id: 'build-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build -t gcr.io/$PROJECT_ID/bhramari-api:latest .
    volumes:
      - name: 'dockersock'
        path: '/var/run/docker.sock'

  # Push to Google Container Registry
  - name: 'docker'
    id: 'push-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker tag gcr.io/$PROJECT_ID/bhramari-api:latest \
          gcr.io/$PROJECT_ID/bhramari-api:$COMMIT_SHA
        docker push gcr.io/$PROJECT_ID/bhramari-api:latest
        docker push gcr.io/$PROJECT_ID/bhramari-api:$COMMIT_SHA
    volumes:
      - name: 'dockersock'
        path: '/var/run/docker.sock'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bhramari-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bhramari-api:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    waitFor: ['push-image']

substitutions:
  _REGION: 'us-central1'
